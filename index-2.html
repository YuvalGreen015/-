<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מתכוננים</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#052149">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מתכוננים">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--mute:#5d6b85;--acc:#2a6df4;--ok:#1f9d68;--bad:#d64545;--line:#dde4f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#19233a;--ink:#eef2fb;--mute:#9aa8c4;--acc:#6b9bff;--ok:#44c490;--bad:#ff7a7a;--line:#2b3753}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#19233a;--ink:#eef2fb;--mute:#9aa8c4;--acc:#6b9bff;--ok:#44c490;--bad:#ff7a7a;--line:#2b3753}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;font-weight:800;margin:8px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 4px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font:600 15px inherit;font-family:inherit}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
input,textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:400 17px inherit;font-family:inherit;margin-bottom:8px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.btn{padding:12px 16px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:600 16px inherit;font-family:inherit;width:100%}
.btn.sec{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.row{display:flex;gap:8px}
.big{font-size:24px;font-weight:600;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center;padding:8px}
.mute{color:var(--mute);font-size:14px}
.ok{background:var(--ok)}.bad{background:var(--bad)}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item button{background:none;border:0;color:var(--bad);font-size:18px}
.msg{text-align:center;font-weight:600;min-height:28px;margin:6px 0}
.opt{display:block;width:100%;text-align:right;padding:12px;margin-bottom:8px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:400 16px inherit;font-family:inherit}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}

h1{display:flex;align-items:center;gap:10px}
.pg{transform-box:view-box;transform-origin:32px 24px;animation:opn .9s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes opn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#splash{position:fixed;inset:0;z-index:99;background:#052149;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:fo .5s 2.1s forwards}
.lg{border-radius:20%;flex:none}
.logo{position:relative;width:170px;height:170px;border-radius:20%}
.logo img{position:absolute;inset:0;width:100%;height:100%;border-radius:20%;transform-origin:50% 50%;animation:opn2 1s .2s cubic-bezier(.2,.8,.2,1) both}
.logo .l{clip-path:inset(0 50% 0 0)}.logo .r{clip-path:inset(0 0 0 50%)}
@keyframes opn2{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
#splash span{color:#a9cdf5;font-size:18px;opacity:0;animation:fi .6s 1s forwards}
@keyframes fi{to{opacity:1}}
#splash b{font-size:30px;font-weight:800}
@keyframes fo{to{opacity:0;visibility:hidden}}
body.kbon main{padding-bottom:280px}
#kb{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none}
#kb[hidden]{display:none}
#kb .kr{display:flex;gap:5px;margin-bottom:6px;justify-content:center}
#kb button{flex:1;min-width:0;height:44px;border:0;border-radius:8px;background:var(--bg);color:var(--ink);font:500 19px inherit;font-family:inherit;touch-action:manipulation}
#kb button:active{background:var(--line)}
#kb .w{flex:1.5}#kb .sp{flex:4}#kb .go{background:var(--acc);color:#fff;flex:1.5}
.gear,#gear{margin-inline-start:auto}#gear{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-size:22px;line-height:1.3}
.navb{background:var(--acc);border:0;color:#fff;font:700 20px inherit;font-family:inherit;padding:12px 22px;min-height:48px;border-radius:14px;margin-bottom:12px}
.tile{display:flex;align-items:center;gap:14px;width:100%;padding:18px;margin-bottom:14px;border:0;border-radius:20px;color:#fff;text-align:right;font-family:inherit;box-shadow:0 6px 16px rgba(30,60,120,.18)}
.tile.ph{min-height:132px;background-size:cover;background-position:right center;padding:14px;padding-inline-start:36%;box-shadow:0 6px 16px rgba(0,0,0,.2);color:#fff}
.tile.ph .tt b{font-size:26px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.tile.ph .tt small{text-shadow:0 1px 5px rgba(0,0,0,.7);font-size:15px;opacity:1}
.tile.ph .tm{background:rgba(255,255,255,.3);font-weight:600}
.tile.ex{display:block;padding:0;min-height:0;aspect-ratio:419/138;background-size:100% 100%;background-repeat:no-repeat;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.tile:active{transform:scale(.98)}
.ti.e{display:flex;align-items:center;justify-content:center;font-size:46px;background:rgba(255,255,255,.22);box-shadow:none}
.ti{width:84px;height:84px;border-radius:24%;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.tt{flex:1;display:flex;flex-direction:column}.tt b{font-size:22px}.tt small{opacity:.92;font-size:14px}
.tm{font-size:13px;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.subj{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 12px;background:#fff;border:2px solid var(--line);border-radius:18px;color:#14213d;font-family:inherit}
.si{width:100%;height:110px;object-fit:contain}
.subj b{font-size:17px}.subj small{color:#5d6b85}.se{font-size:30px}
.x{position:absolute;top:4px;left:6px;color:var(--bad);font-size:18px;padding:6px}
.gi{width:64px;height:48px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:0 0 6px 6px;font-weight:600}.chip b{color:var(--bad);padding:2px 4px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0}
</style>
</head>

<script>
let S={cards:[],words:[],subjects:[],mats:{},scores:[],grades:{}},tab=0,SUBJ='',edit=false,mode='list',idx=0,flip=false,queue=[],stat={ok:0,bad:0},cur=null,done=false;
try{const r=localStorage.getItem('study');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.subjects=['מתמטיקה','היסטוריה','עברית','מדעים','תנ"ך','אנגלית'];S.mats=S.mats||{};
const save=()=>{try{localStorage.setItem('study',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){
 navDraw();
 if(showSet){settingsView();kbSync();return}
 tab==0?homeView():tab==5?gradesView():tab==4?subjectsView():tab==3?testView():tab==1?cardsView():wordsView();
 kbSync();
}
/* ---- מבחנים ---- */
function cardsView(){
 const v=$('v');
 if(mode=='quiz'){
  if(!queue.length){if(!stat.saved){stat.saved=1;rec('cards',stat.ok,stat.ok+stat.bad)}v.innerHTML=`<div class="card"><div class="big">סיימת! ✅</div><div class="msg">ידעת ${stat.ok} · לחזור על ${stat.bad}</div><button class="btn" id="back">חזרה</button></div>`;$('back').onclick=()=>{mode='list';render()};return}
  const c=queue[0];
  v.innerHTML=`<div class="card"><div class="mute">נשארו ${queue.length} פתקיות</div><div class="big" id="cd">${esc(flip?c.a:c.q)}</div>
  ${flip?`<div class="row"><button class="btn bad" id="no">עוד לא</button><button class="btn ok" id="yes">ידעתי</button></div>`:`<button class="btn" id="show">הצג תשובה</button>`}
  <button class="btn sec" id="back" style="margin-top:8px">סיום</button></div>`;
  $('back').onclick=()=>{mode='list';render()};
  if(flip){$('yes').onclick=()=>{stat.ok++;queue.shift();flip=false;render()};$('no').onclick=()=>{stat.bad++;queue.push(queue.shift());flip=false;render()}}
  else $('show').onclick=()=>{flip=true;render()};
  return}
 v.innerHTML=`<div class="card"><textarea id="q" rows="2" placeholder="שאלה או מושג"></textarea><textarea id="a" rows="2" placeholder="תשובה"></textarea><button class="btn" id="add">הוסף פתקית</button></div>
 ${S.cards.length?`<button class="btn" id="go">תרגול (${S.cards.length} פתקיות)</button>`:`<p class="mute" style="text-align:center">הוסף פתקיות כדי להתחיל לתרגל</p>`}
 <div class="card" ${S.cards.length?'':'hidden'}>${S.cards.map((c,i)=>`<div class="item"><span>${esc(c.q)}</span><button data-i="${i}" aria-label="מחק">✕</button></div>`).join('')}</div>`;
 $('add').onclick=()=>{const q=$('q').value.trim(),a=$('a').value.trim();if(!q||!a)return;S.cards.push({q,a});save();render()};
 if(S.cards.length)$('go').onclick=()=>{queue=shuffle(S.cards);stat={ok:0,bad:0};flip=false;mode='quiz';render()};
 v.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S.cards.splice(+b.dataset.i,1);save();render()});
}
/* ---- הכתבות ---- */
function pickVoice(lang,g){
 const k=lang.slice(0,2),ok=l=>l.startsWith(k)||(k=='he'&&l.startsWith('iw'));
 const vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>ok(v.lang.replace('_','-').toLowerCase()));
 vs.sort((a,b)=>(b.localService?1:0)-(a.localService?1:0));
 if(!g)return vs[0]||null;
 const male=v=>/\bmale\b|daniel|alex|david|mark|fred|george|james|asaf|arthur|guy|ryan|rishi/i.test(v.name)&&!/female/i.test(v.name);
 const fem=v=>/female|zira|samantha|karen|victoria|susan|hazel|tessa|moira|fiona|carmit|helena|aria|jenny|google us english/i.test(v.name);
 return vs.find(g=='male'?male:fem)||null;
}
function speak(t){
 try{
  if(!('speechSynthesis' in window)){toast('הדפדפן הזה לא תומך בהקראה');return}
  const lang=isEn(t)?'en-US':'he-IL',u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.85;u.volume=1;
  let g='',pt=1;
  if(S.voice=='male'){g='male';pt=.5}else if(S.voice=='female'){g='female';pt=1.6}
  else if(S.voice=='mine'&&S.hz){g=S.hz>=165?'female':'male';pt=Math.max(.5,Math.min(2,S.hz/(g=='female'?210:120)))}
  const ex=S.vn&&S.vn[lang.slice(0,2)]?speechSynthesis.getVoices().find(x=>x.name==S.vn[lang.slice(0,2)]):null;
  const gv=g?pickVoice(lang,g):null,v=ex||gv||pickVoice(lang,'');
  if(v)u.voice=v;
  if(g&&(S.voice=='mine'||(!gv&&!ex)))u.pitch=pt;
  u.onerror=e=>{if(e.error&&e.error!='canceled'&&e.error!='interrupted')toast('ההקראה נכשלה: '+e.error+'. בדוק שהווליום של המדיה למעלה.')};
  if(speechSynthesis.getVoices().length&&!pickVoice(lang,''))toast(lang=='he-IL'?'אין קול בעברית במכשיר. בהגדרות הטלפון: ניהול כללי ← המרת טקסט לדיבור ← הורד עברית.':'אין קול באנגלית במכשיר.');
  speechSynthesis.cancel();
  setTimeout(()=>{speechSynthesis.resume();speechSynthesis.speak(u)},120);
 }catch(err){toast('ההקראה נכשלה')}
}
function wordsView(){
 const v=$('v');
 if(mode=='trans'){transView();return}
 if(mode=='quiz'){
  if(!queue.length){if(!stat.saved){stat.saved=1;rec('dict',stat.ok,stat.ok+stat.bad)}v.innerHTML=`<div class="card"><div class="big">סיימת הכתבה! 🎉</div><div class="msg">נכון: ${stat.ok} · טעויות: ${stat.bad}</div><div class="bar"><i style="width:${Math.round(100*stat.ok/Math.max(1,stat.ok+stat.bad))}%"></i></div><button class="btn" id="back">חזרה</button></div>`;$('back').onclick=()=>{mode='list';render()};return}
  cur=queue[0];

function voiceCard(){
 const all=window.speechSynthesis?speechSynthesis.getVoices():[];
 const vl=k=>all.filter(x=>{const l=x.lang.toLowerCase();return l.startsWith(k)||(k=='he'&&l.startsWith('iw'))});
 const sel=(k,t)=>`<label class="mute">${t}</label><select data-vn="${k}" style="width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:400 16px inherit;margin-bottom:8px"><option value="">אוטומטי</option>${vl(k).map(x=>`<option value="${esc(x.name)}" ${S.vn&&S.vn[k]==x.name?'selected':''}>${esc(x.name)}${x.localService?'':' (אונליין)'}</option>`).join('')}</select>`;
 return `<div class="card"><p style="font-weight:600;margin-top:0">קול המכשיר</p><p class="mute" style="margin-top:0">אם הקול לא מתאים, בחר כאן קול אחר. בכל בחירה תישמע דוגמה. קולות אונליין לא תמיד מגיבים להתאמת גובה.</p>${all.length?sel('he','עברית')+sel('en','אנגלית'):'<p class="mute">לא נמצאו קולות במכשיר.</p>'}</div>`;
}
function settingsView(){
 const v=$('v'),vo=S.voice||'';
 const opt=(k,t)=>`<button class="btn ${vo==k?'':'sec'}" data-v="${k}">${t}</button>`;
 v.innerHTML=`<div class="card"><p style="font-weight:600;margin-top:0">סגנון קול</p>
 <div class="row" style="margin-bottom:8px">${opt('female','בת')}${opt('male','בן')}</div>${opt('mine','🎙 הקול שלי')}
 <div style="height:8px"></div><button class="btn sec" id="demo">השמע דוגמה</button></div>
 ${vo=='mine'?`<div class="card"><p style="margin-top:0">לחץ על "הקלט" ואמור "אאאאאא" ברצף במשך 3 שניות. האפליקציה תזהה את גובה הקול שלך ותתאים אליו את הקראת המילים.</p>
 ${recBusy?'<div class="big" style="min-height:70px">🎙 מקליט… אמור אאאאאא</div>':`<button class="btn" id="rc">🎙 ${S.hz?'הקלט שוב':'הקלט'}</button>`}
 <div class="msg" style="color:var(--bad)">${esc(recMsg)}</div>
 <p style="margin:12px 0 4px;font-weight:600">או קבע את גובה הקול ידנית</p>
 <input type="range" id="hz" min="80" max="300" value="${S.hz||150}" style="padding:0;margin:4px 0">
 <div class="row mute" style="justify-content:space-between"><span>נמוך (בן)</span><span id="hzl">${S.hz?S.hz+' הרץ':'לא נקבע'}</span><span>גבוה (בת)</span></div>
 ${S.hz?`<p class="mute">זוהה גובה קול: כ-${S.hz} הרץ (${S.hz>=165?'גבוה, כמו בת':'נמוך, כמו בן'}).</p>`:''}
 <p class="mute">חשוב לדעת: האפליקציה מתאימה את גובה הקול של ההקראה לקול שלך, אבל לא יכולה לשכפל את הצליל המדויק שלו.</p></div>`:''}
${voiceCard()}
 <button class="btn sec" id="sb">חזרה</button>`;
 v.querySelectorAll('[data-vn]').forEach(sel=>sel.onchange=()=>{S.vn=S.vn||{};S.vn[sel.dataset.vn]=sel.value||undefined;save();speak(sel.dataset.vn=='he'?(S.words.find(w=>!isEn(w))||'שלום'):'Hello')});
 v.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.voice=b.dataset.v;save();render()});
 if($('rc'))$('rc').onclick=recordVoice;
 if($('hz')){$('hz').oninput=e=>{S.hz=+e.target.value;S.voice='mine';$('hzl').textContent=S.hz+' הרץ'};$('hz').onchange=()=>{save();speak(S.words[0]||'Hello')}}
 $('demo').onclick=()=>speak(S.words[0]||'Hello');
 $('sb').onclick=()=>{showSet=false;render()};
}

const VER='1.39';
function navDraw(){
 const n=$('nav');
 if(!tab&&!showSet){n.innerHTML='';return}
 n.innerHTML=`<button class="navb" id="nb">→ ${showSet?'חזרה':tab==3?'מקצועות':'בית'}</button>`;
 $('nb').onclick=()=>{if(showSet){showSet=false}else if(tab==3){tab=4;T.qs=[]}else{tab=0;mode='list'}render()};
}

function subjectsView(){
 $('v').innerHTML=`<p style="font-size:24px;font-weight:800;margin:0 0 4px">מבחנים</p><p class="mute" style="margin:0 0 14px">בחר מקצוע</p>
 <div class="grid">${S.subjects.map((n,i)=>`<button class="subj" data-s="${i}"><img class="si" src="${IM[n]||''}" alt=""><b>${esc(n)}</b><small>${S.mats[n]?'יש חומר ✓':'אין חומר עדיין'}</small></button>`).join('')}</div>`;
 $('v').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{SUBJ=S.subjects[+b.dataset.s];T.qs=[];tab=3;render()});
}
function rec(k,s,t,sub){if(!t)return;S.scores=S.scores||[];S.scores.push({k,s,t,sub:sub||'',d:Date.now()});if(S.scores.length>300)S.scores.shift();save()}
let gConfirm=false;
function gradesView(){
 const v=$('v'),sc=S.scores||[],pc=x=>Math.round(100*x.s/x.t);
 S.grades=S.grades||{};
 const EMO={'מתמטיקה':'➗','היסטוריה':'🏛️','עברית':'📖','מדעים':'🔬','תנ"ך':'📜','אנגלית':'🔤'};
 const col=p=>p>=85?'var(--ok)':p>=60?'var(--acc)':'var(--bad)';
 const avg=a=>a.length?Math.round(a.reduce((m,x)=>m+x,0)/a.length):null;
 const all=[].concat(...S.subjects.map(n=>S.grades[n]||[]));
 const tot=avg(all);
 let h='<p style="font-size:24px;font-weight:800;margin:0 0 12px">ציונים</p>';
 h+=`<div class="card" style="text-align:center"><div class="mute">הממוצע הכללי שלי</div><div style="font-size:42px;font-weight:800;color:${tot===null?'var(--mute)':col(tot)}">${tot===null?'—':tot}</div></div>`;
 h+=S.subjects.map((n,i)=>{
  const g=S.grades[n]||[],a=avg(g),t=sc.filter(x=>x.k=='test'&&x.sub==n),ta=t.length?Math.round(t.reduce((m,x)=>m+pc(x),0)/t.length):null;
  return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px"><span style="display:flex;align-items:center;gap:10px"><img class="gi" src="${IM[n]||''}" alt=""><b style="font-size:18px">${esc(n)}</b></span><span style="font-weight:800;font-size:20px;color:${a===null?'var(--mute)':col(a)}">${a===null?'—':a}</span></div>
  <div>${g.map((x,j)=>`<span class="chip">${x}<b data-gd="${i}:${j}">✕</b></span>`).join('')||'<span class="mute">עוד לא הוספת ציונים</span>'}</div>
  <div class="row" style="margin-top:8px"><input id="g${i}" type="number" inputmode="numeric" min="0" max="100" placeholder="ציון" style="margin:0"><button class="btn" data-ga="${i}" style="width:auto;padding:12px 22px">הוסף</button></div>
  ${ta!==null?`<div class="mute" style="margin-top:8px">תרגול במבחנים באפליקציה: ${ta}% (${t.length})</div>`:''}</div>`}).join('');
 const lab=x=>x.k=='test'?'מבחן · '+x.sub:x.k=='trans'?'תרגום מילים':x.k=='dict'?'הכתבה':'פתקיות';
 if(sc.length){
  const last=sc.slice(-20).reverse().map(x=>`<div class="item"><span>${esc(lab(x))}<br><small class="mute">${new Date(x.d).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})}</small></span><span style="text-align:left;font-weight:700;color:${col(pc(x))}">${fmt(x.s)}/${x.t}<br><small>${pc(x)}%</small></span></div>`).join('');
  h+=`<div class="card"><p style="font-weight:600;margin:0 0 4px">תרגולים אחרונים</p>${last}</div><button class="btn sec" id="gd">${gConfirm?'לחץ שוב כדי למחוק את התרגולים':'מחיקת היסטוריית התרגולים'}</button>`;
 }
 v.innerHTML=h;
 v.querySelectorAll('[data-ga]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ga,x=parseFloat($('g'+i).value);if(isNaN(x)||x<0||x>100)return;const n=S.subjects[i];S.grades[n]=(S.grades[n]||[]).concat(x);save();render()});
 v.querySelectorAll('[data-gd]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.gd.split(':').map(Number),n=S.subjects[i];S.grades[n].splice(j,1);save();render()});
 if($('gd'))$('gd').onclick=()=>{if(!gConfirm){gConfirm=true;render();return}S.scores=[];gConfirm=false;save();render()};
}
render();
</script>
